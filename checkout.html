<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Velours Rouge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
  <img src="images/logo.jpg" alt="VR Logo">
</div>
</header>

<section class="checkout-page">
  <h1>Checkout</h1>

  <form class="checkout-form">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Delivery Address" required>
    <input type="tel" placeholder="Phone Number" required>
    <input type="email" placeholder="Email Address" required>

    <button type="button" onclick="goToPayment()" class="btn">
      Continue to Payment
    </button>
  </form>
</section>

<footer class="footer">
  <p>© 2026 Velours Rouge</p>
</footer>

<script src="script.js"></script>
</body>
</html>
